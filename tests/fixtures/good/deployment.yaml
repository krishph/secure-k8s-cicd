apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "backend"
  namespace: "securecicd"
  labels:
    app: "backend"
    app.kubernetes.io/part-of: "securecicd"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "backend"
  template:
    metadata:
      labels:
        app: "backend"
        app.kubernetes.io/part-of: "securecicd"
    spec:
      serviceAccountName: "voting-app"
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: "RuntimeDefault"
      containers:
        -
          name: "backend"
          image: "docker.io/securecicd/backend:dev"
          imagePullPolicy: "IfNotPresent"
          ports:
            -
              containerPort: 8000
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          volumeMounts:
            -
              name: "writable"
              mountPath: "/tmp"
          env:
            -
              name: "REDIS_URL"
              value: "redis://redis:6379/0"
          readinessProbe:
            httpGet:
              path: "/readyz"
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        -
          name: "writable"
          emptyDir:
            sizeLimit: "64Mi"
