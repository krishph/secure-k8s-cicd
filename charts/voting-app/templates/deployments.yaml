{{- range $name, $component := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
    app.kubernetes.io/part-of: securecicd
spec:
  replicas: {{ $component.replicas }}
  {{- if eq $name "redis" }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/part-of: securecicd
    spec:
      serviceAccountName: voting-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.uid }}
        runAsGroup: {{ $component.uid }}
        fsGroup: {{ $component.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $component.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-or-db
              containerPort: {{ $component.port }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          {{- if eq $name "backend" }}
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          {{- end }}
          {{- if eq $name "redis" }}
          command: [redis-server, --save, "", --appendonly, "no"]
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- else }}
          readinessProbe:
            httpGet:
              path: {{ $component.probe }}
              port: {{ $component.port }}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $component.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - name: writable
              mountPath: {{ if eq $name "redis" }}/data{{ else }}/tmp{{ end }}
      volumes:
        - name: writable
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
